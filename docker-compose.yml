services:
  db:
    image: mysql:9.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME_DEV}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  rails:
    build: ./rails
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server"
    volumes:
      - ./rails:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME_DEV: ${DB_NAME_DEV}
      DB_NAME_TEST: ${DB_NAME_TEST}
      RAILS_ENV: development
    tty: true
    stdin_open: true

  next:
    build: ./next
    command: npm run dev
    volumes:
      - ./next:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - rails
    environment:
      API_BASE_URL: http://rails:3000

volumes:
  mysql_data:
  bundle_cache: