# config/database.yml
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV["RAILS_MAX_THREADS"] || 5 %>
  username: <%= ENV["DB_USERNAME"] || "root" %>
  password: <%= ENV["DB_PASSWORD"] || "" %>
  host:     <%= ENV["DB_HOST"] || "127.0.0.1" %>   # ローカルはTCP
  port:     <%= ENV["DB_PORT"] || "3306" %>

development:
  <<: *default
  database: <%= ENV["DB_NAME_DEV"] || "myapp_development" %>

test:
  <<: *default
  database: <%= ENV["DB_NAME_TEST"] || "myapp_test" %>

production:
  <<: *default
  database: <%= ENV["DB_NAME"] || "myapp_production" %>
  # 本番は必ずENVで上書きする想定（値は用意してください）
  username: <%= ENV["DB_USERNAME"] || "root" %>
  password: <%= ENV["DB_PASSWORD"] || "" %>
  host:     <%= ENV["DB_HOST"] || "127.0.0.1" %>
  port:     <%= ENV["DB_PORT"] || "3306" %>
