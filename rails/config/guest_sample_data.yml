concerns:
  # 1. 上司の件（ロードマップ空）
  - trigger_event: "上司が細かいことにイライラしながら注意してくる。\nムカつくし、メンタル削れるからどうにかしたい。"
    content: "上司が私のやり方に文句を言ってきた。\nあんたなんかにはわからないだろうけど、こっちもこっちでちゃんと考えて今のやり方にしてんだよ！！マジムカつくぜー\nただ、それを上司に伝えるわけでもなく、はいわかりましたみたいな感じにしてたな。\n一回、ちゃんと自分はこう考えていますって伝えてみるか。うざいけど\nそもそも、なんであんな細かいことをいちいち注意してくんだよ。全体感覚持てよな。\n上司の考えも聞く必要があるな。もし、大した意見じゃなかったら論破してやろうか。\n上司の考えに納得したら、そっちのやり方も考慮する。自分のやり方のほうが良いと思ったら、それを伝えて、理解をしてもらう。\nそれらが、全部ダメならこういう状況含めて、他の先輩に相談だなー。\nめんどくさー。けどまあこういうときは仕方ない。がんばろう"
    issue:
      content: "上司の言い分を聞く\n自分の言い分を話す\nダメそうなら他の人に相談\n\n一応自分のやり方を説明する必要があるから、考えまとめておこう。\n話すときはイライラをできるだけ抑えてクールに、相手も切れたら更に面倒になることを肝に銘じよう"

  # 2. 自炊の件（全部埋まってる）
  - trigger_event: "マジで自炊してみてー\nなんとなくだけど、コンビニとか以外の選択肢ほしい"
    content: "自炊できたらかっけーし、コンビニ飯はいいけど、なんか心がひもじくなる\n\nフライパンと肉買ってきてきてとりあえず焼くか\n塩コショウとかもいるな"
    issue:
      title: "自炊チャレンジ"
      content: "ガスがつながってないから、まずはそこからだな。\n\nコンロも準備してなかった。\n\nあと、皿とかもいるじゃん。紙の皿でいいかなあ\n\n料理以前の問題すぎる"
    roadmap:
      goal: "めざせ、自炊マスター！"
      content: "カレーができたら、達人レベル\n\n道具を揃える。料理後の事も考える\n\n材料を買う\n\n実践。まずは肉だけ\n\n野菜とか切ったり必要\n\nあ、米どうしよう"

  # 3. やりたいこと（issue/roadmap空）
  - trigger_event: ""
    content: "ゲームしたい、アニメみたい、ユーチーブみたいん、\n\n寝たい眠たい、\n\n遊びたい、デートしたい\n旅行行きたい、本読みたい\n\nどっから手を付けるか、まずは会社休む\nそんでちゃんとゆっくり考える時間も大事"

  # 4. 友達とは何か（ライブラリ・アーカイブ済み）
  - trigger_event: "友達とは何かについて考える。\nきっかけなんて聞かないでくれ。"
    content: "友達とはなんだろうか。結局、良い年した大人になっても答えは出ないままだ。\n\nきっと正解とか真実なんてないんだろう。友達なんて人間が作り出した単なる空想でしかない。愛とかと同じだ。\nそれでもあえて、友達を定義するとしたら\nたとえ何年も会わなかったとしても心が通じあえている関係。それが友達だと思う。\n\n小さい頃の自分に教えてやりたいよ。\n自分の都合で歌を聞かせたり、勝手に人の物を自分のものにしたり...\nそんなんじゃ心が通じあえたりするわけなかったんだよな\n元気にしてるかなあ。なあ、心の友よ"
    archived: true # モデル側で具体値を入れる